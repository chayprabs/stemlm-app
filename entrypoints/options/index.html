<!doctype html>
<html lang="en" class="slm-settings-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>stemLM Settings</title>
    <style>
      html.slm-settings-page {
        background: #fbfbfa;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        html.slm-settings-page:not([data-stemlm-theme='light']) {
          background: #151515;
          color-scheme: dark;
        }
      }
      html.slm-settings-page[data-stemlm-theme='dark'] {
        background: #151515;
        color-scheme: dark;
      }
      html.slm-settings-page[data-stemlm-theme='light'] {
        background: #fbfbfa;
        color-scheme: light;
      }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/32.png" />
  </head>
  <body class="slm-page slm-settings-page">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
