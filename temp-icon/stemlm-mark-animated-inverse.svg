<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     fill="none" role="img" aria-label="stemlm">
  <title>stemlm — thinking resolves into therefore</title>

  <!-- left premise -->
  <circle cx="12" cy="45" r="7" fill="#FFFFFF">
    <animate attributeName="cy" values="45;40;45;45;45" keyTimes="0;0.05;0.11;0.9;1" dur="3.6s"
             calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;0 0 1 1;0 0 1 1" repeatCount="indefinite"/>
    <animate attributeName="cx" values="12;12;18;18;12" keyTimes="0;0.36;0.52;0.9;1" dur="3.6s"
             calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1" repeatCount="indefinite"/>
  </circle>

  <!-- right premise -->
  <circle cx="52" cy="45" r="7" fill="#FFFFFF">
    <animate attributeName="cy" values="45;45;40;45;45;45" keyTimes="0;0.09;0.14;0.20;0.9;1" dur="3.6s"
             calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;.4 0 .2 1;0 0 1 1;0 0 1 1" repeatCount="indefinite"/>
    <animate attributeName="cx" values="52;52;46;46;52" keyTimes="0;0.36;0.52;0.9;1" dur="3.6s"
             calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1" repeatCount="indefinite"/>
  </circle>

  <!-- the conclusion: rises, squares off, lights up -->
  <rect x="25" y="38" width="14" height="14" rx="7" fill="#FFFFFF">
    <animate attributeName="y" values="38;33;38;38;15;15;38" keyTimes="0;0.07;0.13;0.36;0.52;0.9;1" dur="3.6s"
             calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1" repeatCount="indefinite"/>
    <animate attributeName="rx" values="7;7;4.2;4.2;7" keyTimes="0;0.42;0.58;0.9;1" dur="3.6s"
             calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#FFFFFF;#FFFFFF;#FF6B2C;#FF6B2C;#FFFFFF"
             keyTimes="0;0.42;0.58;0.9;1" dur="3.6s" repeatCount="indefinite"/>
  </rect>
</svg>
