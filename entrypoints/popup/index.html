<!doctype html>
<html lang="en" class="slm-popup-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>stemLM</title>
    <style>
      html.slm-popup-page {
        width: 312px;
        background: #f5f5f5;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        html.slm-popup-page:not([data-stemlm-theme='light']) {
          background: #151515;
          color-scheme: dark;
        }
      }
      html.slm-popup-page[data-stemlm-theme='dark'] {
        background: #151515;
        color-scheme: dark;
      }
      html.slm-popup-page[data-stemlm-theme='light'] {
        background: #f5f5f5;
        color-scheme: light;
      }
    </style>
    <script>
      (function () {
        var theme = 'light';
        try {
          var raw = localStorage.getItem('stemlm_theme_boot');
          var cached = raw ? JSON.parse(raw) : null;
          if (cached && (cached.pref === 'light' || cached.pref === 'dark')) {
            theme = cached.pref;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (e) {
          try {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
          } catch (e2) {}
        }
        var root = document.documentElement;
        root.setAttribute('data-stemlm-theme', theme);
        root.style.colorScheme = theme;
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="slm-page slm-popup-page">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
