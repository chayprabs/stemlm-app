<!doctype html>
<!-- Chrome Web Store small promo tile, 440x280. Rendered to PNG by scripts/visual/store-shots.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; src: url('../assets/fonts/ibm-plex/IBMPlexSans-Regular-Latin1.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 600; src: url('../assets/fonts/ibm-plex/IBMPlexSans-SemiBold-Latin1.woff2') format('woff2'); }
  html, body { margin: 0; }
  body {
    width: 440px; height: 280px; box-sizing: border-box; padding: 0 36px;
    display: grid; grid-template-columns: 88px 1fr; align-items: center; column-gap: 24px;
    background: #fbfbfa; color: #121212; font-family: 'IBM Plex Sans', sans-serif;
    border-bottom: 6px solid #c2410c;
  }
  img { width: 88px; height: 88px; display: block; }
  h1 { margin: 0; font-size: 44px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
  p { margin: 12px 0 0; font-size: 16px; line-height: 1.35; color: #55555c; }
</style>
</head>
<body>
  <img src="../public/icon/128.png" alt="">
  <div>
    <h1>stemlm</h1>
    <p>Step-by-step STEM study pages beside your AI chat.</p>
  </div>
</body>
</html>
